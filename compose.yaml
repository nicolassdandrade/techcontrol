services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: techcontrol
      POSTGRES_USER: techcontrol
      POSTGRES_PASSWORD: techcontrol_local
    ports:
      - "5432:5432"
    volumes:
      - techcontrol_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U techcontrol"]
      interval: 5s
      retries: 10
volumes:
  techcontrol_data:
