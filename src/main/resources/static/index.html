<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TechControl — Equipamentos</title><style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color:#172235;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}header{background:#122b4a;color:white;padding:24px max(24px,calc((100vw - 1100px)/2))}header h1{margin:0;font-size:26px}header p{margin:5px 0 0;color:#c8d6e7}main{max-width:1100px;margin:30px auto;padding:0 20px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}.stat,.panel{background:white;border:1px solid #e0e6ef;border-radius:12px;padding:20px;box-shadow:0 3px 15px #132b4b0a}.stat strong{display:block;font-size:30px;margin-top:5px}.stat span{color:#52617a}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}.top h2{margin:0;font-size:19px}button{border:0;border-radius:8px;padding:10px 14px;cursor:pointer;font-weight:600;background:#1858a5;color:white}button.secondary{background:#e9eef6;color:#193654}button.danger{background:#fff0f0;color:#a42b2b}button:hover{filter:brightness(.95)}input,select,textarea{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:7px;background:white;color:#1a2a40;font:inherit}label{display:block;font-size:13px;font-weight:600;margin:0 0 6px}.filters{display:flex;gap:12px;margin-bottom:16px}.filters input{flex:2}.filters select{flex:1}table{border-collapse:collapse;width:100%;font-size:14px}th{text-align:left;color:#64748b;background:#f8fafc}td,th{padding:12px;border-bottom:1px solid #e8edf4}td.actions{white-space:nowrap}td.actions button{margin-right:4px;padding:7px 10px} .tablewrap{overflow:auto}.pill{display:inline-block;border-radius:20px;padding:5px 9px;background:#e8eef7;color:#284d7e;font-size:12px}.pill.MANUTENCAO{background:#fff1da;color:#8b5800}.pill.DISPONIVEL{background:#e0f6e9;color:#17673c}dialog{border:0;border-radius:14px;padding:25px;max-width:540px;width:calc(100% - 30px);box-shadow:0 15px 60px #0004}dialog::backdrop{background:#0c1c36a0}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.wide{grid-column:1/-1}.formactions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}#message{min-height:25px;color:#b42318;margin:8px 0}#empty{padding:20px;color:#64748b;text-align:center}@media(max-width:650px){.stats{grid-template-columns:1fr 1fr}.filters{flex-direction:column}.formgrid{grid-template-columns:1fr}}
</style></head><body><header><h1>TechControl</h1><p>Gestão de equipamentos de TI</p></header><main><section class="stats"><div class="stat"><span>Total</span><strong id="total">0</strong></div><div class="stat"><span>Em uso</span><strong id="uso">0</strong></div><div class="stat"><span>Disponíveis</span><strong id="disponiveis">0</strong></div><div class="stat"><span>Em manutenção</span><strong id="manutencao">0</strong></div></section><section class="panel"><div class="top"><h2>Equipamentos cadastrados</h2><button id="novo">+ Novo equipamento</button></div><div class="filters"><input id="busca" placeholder="Buscar por nome, tipo ou patrimônio" aria-label="Buscar equipamentos"><select id="filtro"><option value="">Todas as situações</option><option value="EM_USO">Em uso</option><option value="DISPONIVEL">Disponível</option><option value="MANUTENCAO">Em manutenção</option></select></div><div id="message" role="alert"></div><div class="tablewrap"><table><thead><tr><th>Nome</th><th>Tipo</th><th>Patrimônio</th><th>Sistema</th><th>Situação</th><th>Ações</th></tr></thead><tbody id="linhas"></tbody></table></div><p id="empty" hidden>Nenhum equipamento encontrado.</p></section></main><dialog id="modal"><form id="form"><h2 id="titulo">Novo equipamento</h2><div class="formgrid"><div><label for="nome">Nome *</label><input id="nome" maxlength="100" required></div><div><label for="tipo">Tipo *</label><input id="tipo" maxlength="40" placeholder="Notebook, Desktop..." required></div><div><label for="patrimonio">Patrimônio *</label><input id="patrimonio" maxlength="50" required></div><div><label for="so">Sistema operacional</label><input id="so" maxlength="100"></div><div class="wide"><label for="situacao">Situação *</label><select id="situacao" required><option value="EM_USO">Em uso</option><option value="DISPONIVEL">Disponível</option><option value="MANUTENCAO">Em manutenção</option></select></div><div class="wide"><label for="observacoes">Observações</label><textarea id="observacoes" rows="3" maxlength="500"></textarea></div></div><div class="formactions"><button class="secondary" type="button" id="cancelar">Cancelar</button><button type="submit">Salvar equipamento</button></div></form></dialog><script src="/app.js"></script></body></html>
